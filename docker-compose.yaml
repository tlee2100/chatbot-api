services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatbot-db
    restart: always

    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: ${DB_DATABASE:-nestjs_db}

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis1
    restart: always

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
